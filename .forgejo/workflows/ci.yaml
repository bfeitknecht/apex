# Mirror of .github/workflows/ci.yaml for a Forgejo runner.
# Differences: the runner labels (docker, ubuntu-latest on the cluster forgejo-runner),
# fully-qualified action URLs (the default action source may differ per instance).
# The GitHub release job stays on GitHub: `gh release` publishes there.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: https://github.com/actions/checkout@v4
      - uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: https://github.com/Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Lints
        run: cargo clippy --all-targets --features ssh -- -D warnings
      - name: Tests
        run: |
          cargo test
          cargo test --features ssh
      - name: Browser target compiles
        run: cargo check --target wasm32-unknown-unknown
      - uses: https://github.com/taiki-e/install-action@v2
        with:
          tool: trunk
      - name: Browser bundle
        run: |
          set -eu
          trunk build --release
          test -f dist/apex.js
          test -f dist/apex_bg.wasm
          test -f dist/boot.js
          test -f dist/app.css
          test -f dist/cursor.js
          test -f dist/NotoSansKhmer-Regular.ttf
