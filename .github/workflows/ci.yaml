name: CI

on:
  # One branch carries the site: `master`, the default branch. Neither `main` nor
  # `rework` exists any more. A trigger that named them meant that CI never ran on
  # a push.
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    env:
      # Plain text in the log and in the annotations below.
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Lints
        run: |
          set -o pipefail
          cargo clippy --all-targets --features ssh -- -D warnings 2>&1 | tee clippy.log
      - name: Report the lint errors
        if: failure()
        # The job log lives in storage that some clients cannot read.
        # Annotations are readable through the API, so repeat the error lines here.
        run: |
          echo "::error::clippy.log: $(wc -c < clippy.log 2>/dev/null || echo 0) bytes, $(wc -l < clippy.log 2>/dev/null || echo 0) lines"
          echo "::error::$(rustc --version 2>&1) | $(cargo --version 2>&1)"
          grep -a -i "error" clippy.log 2>/dev/null | head -8 | while IFS= read -r line; do
            echo "::error::${line//%/%25}"
          done
          tail -n 12 clippy.log 2>/dev/null | while IFS= read -r line; do
            echo "::error::${line//%/%25}"
          done
      - name: Tests
        run: |
          cargo test
          cargo test --features ssh
      - name: Browser target compiles
        run: cargo check --target wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - name: Browser bundle
        run: |
          set -eu
          trunk build --release
          # The names are stable (`filehash = false`), because the static version comes from
          # Typst and already refers to them.
          test -f dist/apex.js
          test -f dist/apex_bg.wasm
          test -f dist/boot.js
          test -f dist/dynamic.css
          test -f dist/cursor.js
          # Flat in the document root, where the bare @font-face URLs of dynamic.css
          # look for them.
          test -f dist/NotoSansKhmer-Regular.ttf
          test -f dist/Unifont-17.0.05.otf
          test -f dist/UNICODE-LICENSE.txt

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the Typst bundle
        run: |
          set -o pipefail
          docker run --rm -v "$PWD:/work" -w /work \
            ghcr.io/typst/typst:0.15.1 \
            compile --features html,bundle --format bundle \
            --root . static/site.typ public 2>&1 | tee static.log
      - name: Report the build errors
        if: failure()
        # The job log lives in storage that some clients cannot read.
        # Annotations are readable through the API, so repeat the error lines here.
        run: |
          grep -a -i "error" static.log 2>/dev/null | head -12 | while IFS= read -r line; do
            echo "::error::${line//%/%25}"
          done
          tail -n 12 static.log 2>/dev/null | while IFS= read -r line; do
            echo "::error::${line//%/%25}"
          done
      - name: Bundle looks right
        run: |
          set -eu
          test -f public/index.html
          test -f public/404.html
          test -f public/sitemap.xml
          test -f public/robots.txt
          test -f public/llms.txt
          test -f public/assets/favicon.svg
          test -f public/age.txt
          test -f public/pgp.txt
          test -f public/cv.pdf
          grep -q 'id="dynamic-shell"' public/index.html
          grep -q 'src="/boot.js"' public/index.html
          # The static version is unstyled on purpose: no stylesheet, no <style>.
          ! grep -q -e 'rel="stylesheet"' -e '<style' public/index.html public/404.html
          # Both ways between the versions: a link back to / here, `</>` in the dynamic one.
          grep -q '<a href="/" title="The dynamic version of this site">' public/index.html
          # The three destinations.
          grep -q '>cv</a>' public/index.html
          grep -q '>blog</a>' public/index.html
          grep -q '>gallery</a>' public/index.html
          # The CV is emitted byte for byte, not re-encoded.
          cmp content/cv.pdf public/cv.pdf
      - name: The static version lists what the dynamic one lists
        # Both versions read `content/projects.toml` at build time. This check
        # compares the rendered order with the file, so a renderer that sorts,
        # drops or duplicates an entry fails the build.
        run: |
          python3 - <<'CHECK'
          import pathlib, re, tomllib

          projects = tomllib.loads(pathlib.Path("content/projects.toml").read_text())
          expected = [project["name"] for project in projects["project"]]
          html = pathlib.Path("public/index.html").read_text()
          listed = re.findall(r"<tr><td>\d+</td><td><b><a[^>]*>([^<]+)</a>", html)
          assert listed == expected, f"page lists {listed}, content has {expected}"
          print(len(listed), "projects, in content order:", " ".join(listed))
          CHECK
