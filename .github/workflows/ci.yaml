name: CI

on:
  # One branch carries the site: `master`, which is the default branch. (Neither
  # `main` nor the retired `rework` exists any more, so naming them here meant CI
  # silently never ran on a push.)
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Lints
        run: cargo clippy --all-targets --features ssh -- -D warnings
      - name: Tests
        run: |
          cargo test
          cargo test --features ssh
      - name: Browser target compiles
        run: cargo check --target wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - name: Browser bundle
        run: |
          set -eu
          trunk build --release
          # The names are stable on purpose (`filehash = false`): the page is
          # generated by Typst and already refers to them.
          test -f dist/apex.js
          test -f dist/apex_bg.wasm
          test -f dist/boot.js
          test -f dist/app.css
          test -f dist/cursor.js
          # Flat in the document root, where app.css's bare @font-face URLs look.
          test -f dist/NotoSansKhmer-Regular.ttf
          test -f dist/Unifont-17.0.05.otf
          test -f dist/UNICODE-LICENSE.txt

  ssg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Typst bundle
        run: |
          set -eu
          mkdir -p .packages/preview/exemel .packages/preview/thyme
          cp -R ssg/vendor/exemel .packages/preview/exemel/0.3.0
          cp -R ssg/vendor/thyme .packages/preview/thyme/0.1.0
          docker run --rm -v "$PWD:/work" -w /work \
            ghcr.io/typst/typst:0.15.1 \
            compile --features html,bundle --format bundle \
            --package-path /work/.packages --root . \
            ssg/site.typ public
      - name: Bundle looks right
        run: |
          set -eu
          test -f public/index.html
          test -f public/site.typ
          test -f public/404.html
          test -f public/sitemap.xml
          test -f public/robots.txt
          test -f public/contact/index.html
          test -f public/assets/favicon.svg
          test -f public/age.txt
          test -f public/pgp.txt
          test -f public/cv.pdf
          grep -q 'id="app-shell"' public/index.html
          grep -q 'src="/boot.js"' public/index.html
          # `webpage` writes its own document: it has to carry the stylesheet
          # explicitly, or the page ships unstyled.
          grep -q 'rel="stylesheet"' public/contact/index.html
          # The top row is the three destinations, as plain links.
          grep -q '>cv</a>' public/index.html
          grep -q '>blog</a>' public/index.html
          grep -q '>gallery</a>' public/index.html
          # The CV is emitted byte for byte, not re-encoded.
          cmp content/cv.pdf public/cv.pdf
      - name: The page lists what the terminal lists
        # Both surfaces read `content/projects.toml` at build time. This checks
        # the rendered order against that file, so a renderer that sorts, drops
        # or duplicates an entry cannot pass unnoticed.
        run: |
          python3 - <<'CHECK'
          import pathlib, re, tomllib

          projects = tomllib.loads(pathlib.Path("content/projects.toml").read_text())
          expected = [project["name"] for project in projects["project"]]
          html = pathlib.Path("public/index.html").read_text()
          listed = re.findall(r"<h3><a[^>]*>([^<]+)</a>", html)
          assert listed == expected, f"page lists {listed}, content has {expected}"
          print(len(listed), "projects, in content order:", " ".join(listed))
          CHECK
