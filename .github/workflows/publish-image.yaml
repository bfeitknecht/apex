name: Publish Image

on:
  push:
    tags:
      - "v*" # Triggers on tags like v1.0.0, v1.0.1, etc.

jobs:
  publish:
    # The caller caps the GITHUB_TOKEN the called workflow receives, and this
    # repo's default is read-only — so packages: write must be granted here.
    permissions:
      contents: read
      packages: write
    # The build+push logic lives once, in the infra repo.
    uses: bfeitknecht/infra/.github/workflows/publish-image.yaml@master
