name: Publish Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    permissions:
      contents: read
      packages: write
    uses: bfeitknecht/infra/.github/workflows/publish-image.yaml@master
    with:
      # The cluster nodes are arm64 only; the amd64 leg would never be pulled.
      platforms: linux/arm64

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Publish the release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          # The notes are the section of CHANGELOG.md for the version in
          # Cargo.toml, which the tag already matched.
          tag="${GITHUB_REF_NAME}"
          just release --notes > release-notes.md
          cat >> release-notes.md <<'EOF'

          ---
          _Release notes follow [Keep a Changelog](https://keepachangelog.com/en/1.1.0/) and [Semantic Versioning](https://semver.org/spec/v2.0.0.html)._
          EOF
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --notes-file release-notes.md
          else
            gh release create "$tag" --title "$tag" --notes-file release-notes.md
          fi
