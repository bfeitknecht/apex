# Temporary: the sandbox cannot run `typst --format bundle` (the Python binding
# exports single files only, and packages.typst.org is unreachable), so the
# bundle path is diagnosed here and reported back through the branch.
name: SSG probe

on:
  push:
    branches: [arena/ffc24bdf-apex]

permissions:
  contents: write

jobs:
  probe:
    if: ${{ !contains(github.event.head_commit.message, 'ssg probe report') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/ffc24bdf-apex
      - name: Build and report
        run: |
          set +e
          {
            echo "# ssg probe"
            mkdir -p .packages/preview/exemel .packages/preview/thyme
            cp -R ssg/vendor/exemel .packages/preview/exemel/0.3.0
            cp -R ssg/vendor/thyme .packages/preview/thyme/0.1.0
            docker run --rm -v "$PWD:/work" -w /work \
              ghcr.io/typst/typst:0.15.1 \
              compile --features html,bundle --format bundle \
              --package-path /work/.packages --root . \
              ssg/site.typ public 2>&1
            echo "bundle-exit=$?"
            echo
            echo "## public/"
            ls -la public 2>&1
            echo
            echo "## 404.html (first 600 bytes)"
            head -c 600 public/404.html 2>&1
            echo
            echo "## index.html (first 400 bytes)"
            head -c 400 public/index.html 2>&1
          } > SSG-REPORT.txt
          tail -30 SSG-REPORT.txt
      - name: Push the report
        run: |
          git config user.name "apex ci"
          git config user.email "ci@0xbf.ch"
          git add -A
          git commit -m "chore: ssg probe report" || echo "nothing to commit"
          git push origin HEAD:arena/ffc24bdf-apex
