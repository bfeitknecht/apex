[advanced]

[[advanced.headers]]
source = "**"
headers = { Cache-Control = "no-cache" }

[[advanced.headers]]
source = "**/fonts/**"
headers = { Cache-Control = "public, max-age=31536000, immutable" }

[[advanced.headers]]
source = "**/*.typ"
headers = { Content-Type = "text/plain; charset=utf-8", Content-Disposition = "inline", X-Content-Type-Options = "nosniff" }

[[advanced.rewrites]]
source = "/cv"
destination = "/cv.pdf"

[[advanced.redirects]]
source = "/noscript"
destination = "/"
kind = 301

[[advanced.redirects]]
source = "/noscript/"
destination = "/"
kind = 301
