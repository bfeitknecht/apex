# static-web-server configuration for 0xbf.ch.
#
# One document root and one URL space. The browser decides what a visitor gets
# at a path, not the path itself. `/` is the static version, and its boot script
# replaces it with the dynamic version when the browser can run WebAssembly
# (`/?static` keeps the static one). The site has no second path and no second
# host.
#
#   /                  the static version (Typst) + the dynamic version's assets
#   /contact/          a content page of the static version
#   /age.txt /pgp.txt  plain files, emitted by the static build
#   /cv                → /cv.pdf (rewrite below)
#   /404.html          the 404 of the static version

[advanced]

[[advanced.headers]]
# No asset name contains a content hash, because the static and the dynamic version come from
# different toolchains and must agree on the names. All files therefore
# revalidate: the server sends cheap 304 responses and never a stale shell.
source = "**"
headers = { Cache-Control = "no-cache" }

[[advanced.headers]]
# The CV keeps one name at every layer: `content/cv.pdf` in the repository,
# `/cv.pdf` in the document root, `/cv` as the URL, and `cv.pdf` as the name that
# a browser saves (this header).
source = "**/cv.pdf"
headers = { Content-Disposition = "inline; filename=\"cv.pdf\"" }

[[advanced.headers]]
# `llms.txt` is Markdown for language models. Send the bytes as they are.
source = "**/llms.txt"
headers = { Content-Type = "text/markdown; charset=utf-8", X-Content-Type-Options = "nosniff" }

[[advanced.headers]]
# Tadi Web source views. The .typ sources are meant to be read.
source = "**/*.typ"
headers = { Content-Type = "text/plain; charset=utf-8", Content-Disposition = "inline", X-Content-Type-Options = "nosniff" }

[[advanced.rewrites]]
source = "/cv"
destination = "/cv.pdf"
