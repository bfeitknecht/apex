# static-web-server configuration for 0xbf.ch.
#
# One document root and one URL space. The browser decides what a visitor gets
# at a path, not the path itself. `/` is the static page, and its boot script
# replaces the page with the WebAssembly app when the browser can run it. The
# site has no /tui, no /static and no second host.
#
#   /                  the page (Typst) + the app's assets, same document root
#   /contact/          a content page
#   /age.txt /pgp.txt  plain files, emitted by the page build
#   /cv                → /cv.pdf (rewrite below)
#   /404.html          the static site's 404
#
# The app is a single page, so the paths stay simple.

[advanced]

[[advanced.headers]]
# No asset name contains a content hash, because the page and the app come from
# different toolchains and must agree on the names. All files therefore
# revalidate: the server sends cheap 304 responses and never a stale shell.
source = "**"
headers = { Cache-Control = "no-cache" }

[[advanced.headers]]
# The webfonts never change, so the browser can keep them.
source = "**/fonts/**"
headers = { Cache-Control = "public, max-age=31536000, immutable" }

[[advanced.headers]]
# The CV keeps one name at every layer: `content/cv.pdf` in the repository,
# `/cv.pdf` in the document root, `/cv` as the URL, and `cv.pdf` as the name that
# a browser saves (this header).
source = "**/cv.pdf"
headers = { Content-Disposition = "inline; filename=\"cv.pdf\"" }

[[advanced.headers]]
# Tadi Web source views. The .typ sources are meant to be read.
source = "**/*.typ"
headers = { Content-Type = "text/plain; charset=utf-8", Content-Disposition = "inline", X-Content-Type-Options = "nosniff" }

[[advanced.rewrites]]
source = "/cv"
destination = "/cv.pdf"
