# Selected work: one list for every surface.
#
# The order here is the display order everywhere. The terminal numbers the
# entries `#01`, `#02`, ... down the page, and the page prints them in the same
# sequence. This file is therefore the only place that decides the order.
#
# The terminal prints `summary` on the same line as the name. The page prints
# `description` and `period` as a full entry. An empty url is a placeholder that
# does not open yet.

