name = "thyme"
url = "https://github.com/bfeitknecht/thyme"
summary = "Typst based static site generator"
description = "Static site generator and monochrome blog package in pure Typst, with typed HTML, XML sitemaps and feeds, and plaintext .typ source views."
period = "2026"

