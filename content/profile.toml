# The definition of who this site is about.
#
# The Rust core reads this file at build time (`src/content.rs`) and the Typst
# build reads it too (`ssg/site.typ`). No other file holds a copy of these facts.
# A changed link here reaches the terminal, the SSH session, the browser app and
# the page without JavaScript.

name = "Basil Feitknecht"
email = "io+www@0xbf.ch"
# How the address is shown when it is also a link.
email_label = "io@0xbf.ch"
eyebrow = "Grüezi"

# <title> and <meta name="description"> of the static page.
site_title = "Basil Feitknecht"
site_description = "BSc Computer Science at ETH Zürich. Programming languages, formal methods, information security, computer systems and networks, and machine learning."

# One sentence: the hero of the page and the first line of the terminal.
lede = "BSc Computer Science ETH Zürich. Programming languages, formal methods, information security, computer systems and networks, machine learning."

# The paragraph that both surfaces share. The terminal lowercases it at load
# (`about_terminal` in `src/content.rs`) and the page prints it as written. This
# is typography, not a second copy of the text.
about = '''
My interests span wide and deep. From computer science (both in theory and practice) to math, music, and sports. I like to learn, and I like to teach. I want to understand how things work and make them better.
'''

# The terminal adds one extra line to the hero block.
intro = ["student. teacher. artist. engineer. generalist."]

