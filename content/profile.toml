# The one definition of who this site is about.
#
# Read at compile time by the Rust core (`src/content.rs`) and at build time by
# the Typst build (`ssg/site.typ`). Nothing else may hold a copy of these
# facts: change a link here and the terminal, the SSH session, the browser app
# and the no-JavaScript page all follow.

name = "Basil Feitknecht"
