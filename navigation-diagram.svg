<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940">
<rect width="1200" height="940" fill="#0c0c0c"/>
<style>text{font-family:ui-monospace,'DejaVu Sans Mono',monospace;fill:#eee}.title{font-size:24px;letter-spacing:3px}.sub{font-size:13px;fill:#aaa}.label{font-size:16px;font-weight:bold}.desc{font-size:13px;fill:#bbb}.key{font-size:12px;fill:#999}.box{fill:#151515;stroke:#777;stroke-width:1.2}.special{fill:#202020;stroke:#eee;stroke-width:1.4}.line{fill:none;stroke:#aaa;stroke-width:1.5}.dim{fill:none;stroke:#555;stroke-width:1.2}</style>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#aaa"/></marker></defs>
<text class="title" x="48" y="58">APEX / STRUCTURE + NAVIGATION</text><text class="sub" x="48" y="83">One portfolio. Two environment-specific studies. One separate screensaver.</text>
<rect class="box" x="480" y="108" width="240" height="50" rx="3"/><text class="label" x="600" y="140" text-anchor="middle">LAUNCH / CONNECT</text>
<path class="line" marker-end="url(#arrow)" d="M600 158 V185"/><rect class="special" x="440" y="190" width="320" height="70" rx="3"/><text class="label" x="600" y="220" text-anchor="middle">PORTFOLIO</text><text class="desc" x="600" y="244" text-anchor="middle">shared navigation + content</text>
<path class="line" d="M600 260 V292 M175 292 H1025"/>
<path class="line" marker-end="url(#arrow)" d="M175 292 V314 M387 292 V314 M600 292 V314 M813 292 V314 M1025 292 V314"/>
<rect class="box" x="84" y="319" width="182" height="55" rx="3"/><text class="label" x="175" y="353" text-anchor="middle">ABOUT</text>
<rect class="box" x="296" y="319" width="182" height="55" rx="3"/><text class="label" x="387" y="353" text-anchor="middle">PROJECTS</text>
<rect class="box" x="509" y="319" width="182" height="55" rx="3"/><text class="label" x="600" y="353" text-anchor="middle">CONTACT</text>
<rect class="special" x="722" y="319" width="182" height="55" rx="3"/><text class="label" x="813" y="353" text-anchor="middle">STUDY</text>
<rect class="special" x="934" y="319" width="182" height="55" rx="3"/><text class="label" x="1025" y="353" text-anchor="middle">LICHEN</text>
<path class="line" marker-end="url(#arrow)" d="M387 374 V415 M600 374 V415 M1025 374 V415"/>
<rect class="box" x="293" y="420" width="188" height="76" rx="3"/><text class="label" x="387" y="449" text-anchor="middle">PROJECT LINKS</text><text class="desc" x="387" y="475" text-anchor="middle">select → open</text>
<rect class="box" x="506" y="420" width="188" height="76" rx="3"/><text class="label" x="600" y="449" text-anchor="middle">CONTACT + CV</text><text class="desc" x="600" y="475" text-anchor="middle">email / profiles / CV</text>
<rect class="box" x="931" y="420" width="188" height="76" rx="3"/><text class="label" x="1025" y="449" text-anchor="middle">SCREENSAVER</text><text class="desc" x="1025" y="475" text-anchor="middle">fullscreen / separate</text>
<path class="line" d="M813 374 V401 H764 M813 401 H866"/><path class="line" marker-end="url(#arrow)" d="M764 401 V415 M866 401 V415"/>
<rect class="box" x="709" y="420" width="110" height="76" rx="3"/><text class="label" x="764" y="449" text-anchor="middle">UNICODE</text><text class="desc" x="764" y="475" text-anchor="middle">browser</text>
<rect class="box" x="825" y="420" width="83" height="76" rx="3"/><text class="label" x="866" y="449" text-anchor="middle">ASCII</text><text class="desc" x="866" y="475" text-anchor="middle">SSH</text>
<text class="key" x="813" y="527" text-anchor="middle">DISTINCT CONCEPTS · VISUALS TBD</text><text class="key" x="1025" y="527" text-anchor="middle">PAUSE / RESTART / BACK</text>
<line class="dim" x1="48" y1="563" x2="1152" y2="563"/><text class="label" x="48" y="598">INTERACTIONS</text>
<text class="desc" x="48" y="631">Navigation / 1–5</text><text class="desc" x="330" y="631">Select a destination; Study chooses the current environment</text>
<text class="desc" x="48" y="660">↑ ↓ / scroll</text><text class="desc" x="330" y="660">Navigate within content; scrolling does not switch sections</text>
<text class="desc" x="48" y="689">Enter / click / tap</text><text class="desc" x="330" y="689">Activate links and controls; terminal displays copyable URLs</text>
<text class="desc" x="48" y="718">H / ?</text><text class="desc" x="330" y="718">Open separate Help; close to return to the previous view</text>
<text class="desc" x="48" y="747">Escape / Back</text><text class="desc" x="330" y="747">Leave a study, Lichen, or Help and restore the previous view</text>
<text class="desc" x="48" y="776">Lichen: Space / R</text><text class="desc" x="330" y="776">Pause / resume or restart the screensaver</text>
<line class="dim" x1="48" y1="807" x2="1152" y2="807"/>
<text class="desc" x="48" y="840">No Experience or Education sections — the CV carries those details.</text>
<text class="desc" x="48" y="866">No logo, no Lichen behind portfolio, no visual concepts fixed yet.</text>
<text class="key" x="48" y="913">PLANNING ONLY · STUDY CONCEPTS AND NAVIGATION LAYOUT TO BE DECIDED</text>
</svg>
