<!doctype html>
<!--
  The entry point of Trunk. This file is not what visitors get. Typst generates
  the document they receive from `ssg/` (see `ssg/site.typ`), and the boot script
  of that document imports `/apex.js` and `/apex_bg.wasm` from this build. The
  list below makes Trunk copy the assets of the app next to the page, and
  `filehash = false` in `Trunk.toml` keeps the names that the page refers to.

  Trunk resolves every `href` against the directory of this file, not against
  the repository root. `copy-file` without `data-target-path` writes flat into
  the document root, which is what `app.css` expects: its `@font-face` rules name
  the files without a path, so they load from `/` next to `/app.css`.
-->
