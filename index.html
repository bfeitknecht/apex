html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000;cursor:none}body{font-family:'Commit Mono',monospace}pre{font-family:'Commit Mono',monospace;font-size:16px;line-height:1;margin:0}canvas{display:block}#selectable-text{position:fixed;inset:0;z-index:4;margin:0;color:transparent;background:transparent;white-space:pre;overflow:hidden;user-select:text;cursor:none;outline:none}#selectable-text::selection{color:transparent;background:transparent}body > canvas:not(#lichen-pixels):not(#unicode-glyph){width:100vw!important;height:100vh!important}#unicode-glyph{position:fixed;inset:0;pointer-events:none;z-index:3;display:none}#lichen-pixels{position:fixed;inset:0;width:320px;height:200px;image-rendering:pixelated;pointer-events:none;z-index:2}#hint{position:fixed;z-index:5;right:12px;bottom:10px;color:#999;background:#000;font:11px 'Commit Mono',monospace;padding:5px;opacity:.65}

@media(max-width:650px){#hint{font-size:0}#hint:after{content:"SWIPE TO EXPLORE";font-size:11px}}</style></head><body><svg width="0" height="0" aria-hidden="true" style="position:absolute"><defs><filter id="lichen-light-tones" color-interpolation-filters="sRGB"><feComponentTransfer><feFuncR type="table" tableValues="0 .25 .5 1 1"/><feFuncG type="table" tableValues="0 .25 .5 1 1"/><feFuncB type="table" tableValues="0 .25 .5 1 1"/></feComponentTransfer></filter></defs></svg><pre id="selectable-text"></pre><canvas id="lichen-pixels" width="320" height="200"></canvas><canvas id="unicode-glyph"></canvas><div id="cell-cursor" aria-hidden="true"></div><div id="selection-highlights" aria-hidden="true"></div><script>
(()=>{
  const layer=document.getElementById('selectable-text');
  const cursor=document.getElementById('cell-cursor');
  const highlights=document.getElementById('selection-highlights');
  let point=null, mouseMode=false, queued=false;
  function showCursor(){
    queued=false;
    if(!point || !mouseMode || (window.getSelection() && !window.getSelection().isCollapsed) || (getComputedStyle(layer).display!=='none' && layer.dataset.clickable==='true')) { cursor.style.display='none'; return; }
    const s=getComputedStyle(layer), cw=parseFloat(s.getPropertyValue('--cell-width')), ch=parseFloat(s.getPropertyValue('--cell-height'));
    if(!cw || !ch){cursor.style.display='none'; return;}
    cursor.style.width=cw+'px';cursor.style.height=ch+'px';
    cursor.style.left=Math.floor(point.x/cw)*cw+'px';cursor.style.top=Math.floor(point.y/ch)*ch+'px';cursor.style.display='block';
  }
  document.addEventListener('mousemove',e=>{point={x:e.clientX,y:e.clientY};mouseMode=true;if(!queued){queued=true;requestAnimationFrame(showCursor)}});
  document.addEventListener('keydown',e=>{if(!['Shift','Control','Alt','Meta'].includes(e.key)){mouseMode=false;cursor.style.display='none';layer.dataset.clickable='false';}});
  document.addEventListener('wheel',()=>{mouseMode=false;cursor.style.display='none';},{passive:true});
  document.addEventListener('mouseleave',()=>{mouseMode=false;cursor.style.display='none';});
  function selection(){
    showCursor();
    highlights.replaceChildren();
    const s=window.getSelection();
    if(!s || s.isCollapsed || !s.rangeCount || !layer.contains(s.anchorNode) || !layer.contains(s.focusNode)) return;
    for(const r of s.getRangeAt(0).getClientRects()){
      if(r.width<=0 || r.height<=0) continue;
      const d=document.createElement('div');d.className='selection-rect';
      Object.assign(d.style,{left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px'});
      highlights.appendChild(d);
    }
  }
  document.addEventListener('selectionchange',selection);
  window.addEventListener('resize',selection);
})();
</script></body></html>
