[build]
# The entry point of Trunk is `browser/dynamic.html`. That file is not the served
# document. Visitors get the static version that Typst generates from `static/`,
# and it imports the assets of the dynamic version.
target = "browser/dynamic.html"
dist = "dist"
# The dynamic version is served from the document root, and a different
# toolchain generates the static version that starts it. The asset names must therefore stay stable and must
# not contain a content hash. `sws.toml` compensates with `no-cache` (ETag
# revalidation), and the fonts keep the `immutable` rule.
public_url = "/"
filehash = false
