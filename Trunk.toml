[build]
# Trunk's entry point is `browser/app.html`, not the served document: visitors
# get the page Typst generates from `ssg/`, which imports the app's assets.
target = "browser/app.html"
dist = "dist"
# The app is served from the document root, and the page it boots from is
# generated by a different toolchain — so the asset names must be stable
# instead of content-hashed. `sws.toml` compensates with `no-cache` (ETag
# revalidation), and fonts keep the `immutable` rule.
public_url = "/"
filehash = false
