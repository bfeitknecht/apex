[build]
# The entry point of Trunk is `browser/app.html`. That file is not the served
# document. Visitors get the page that Typst generates from `ssg/`, and that page
# imports the assets of the app.
target = "browser/app.html"
dist = "dist"
# The app is served from the document root, and a different toolchain generates
# the page that starts it. The asset names must therefore stay stable and must
# not contain a content hash. `sws.toml` compensates with `no-cache` (ETag
# revalidation), and the fonts keep the `immutable` rule.
public_url = "/"
filehash = false
